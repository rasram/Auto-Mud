<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoMUD live pipeline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">AutoMUD</p><h1>Live pipeline trace</h1></div>
      <div id="safety" class="badge">Loading safety state…</div>
    </header>
    <section id="summary" class="cards"></section>
    <section>
      <div class="section-title"><h2>Recent observations</h2><button id="refresh">Refresh</button></div>
      <p class="hint">Times are separate pipeline stages. The 60-second observation window remains part of response latency.</p>
      <div class="table-wrap"><table><thead><tr><th>Window</th><th>Kind</th><th>Stages</th><th>Window → join</th><th>Join → decision</th><th>Decision → install</th></tr></thead><tbody id="traces"></tbody></table></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
